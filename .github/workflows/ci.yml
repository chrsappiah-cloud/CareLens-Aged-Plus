name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
  # GHA runners may not ship iOS 26.x simulator runtimes; align with downloaded platform.
  IPHONEOS_DEPLOYMENT_TARGET: "18.0"

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install xcbeautify
        run: brew install xcbeautify || true

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project "Carelens-Aged+.xcodeproj" -scheme "Carelens-Aged+"

      - name: Prepare iOS Simulator
        run: bash scripts/ci_prepare_ios_simulator.sh

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "Carelens-Aged+.xcodeproj" \
            -scheme "Carelens-Aged+" \
            -destination "$SIM_DESTINATION" \
            -configuration Debug \
            IPHONEOS_DEPLOYMENT_TARGET="$IPHONEOS_DEPLOYMENT_TARGET" \
            CODE_SIGNING_ALLOWED=NO \
            | (command -v xcbeautify >/dev/null && xcbeautify || cat)

      - name: Verify device E2E scripts present
        run: |
          test -x scripts/run_e2e_device_tests.sh
          test -x scripts/run_e2e_device_systematic.sh

      - name: Verify E2E test plan includes foundations
        run: grep -q "FoundationsTests" E2ETests.xctestplan

      - name: Verify WCS testing kit
        run: bash scripts/wcs_test_readiness_check.sh

      - name: Run unit tests (required)
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "Carelens-Aged+.xcodeproj" \
            -scheme "Carelens-Aged+" \
            -destination "${SIM_TEST_DESTINATION:-$SIM_DESTINATION}" \
            -only-testing:"Carelens-Aged+Tests" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            IPHONEOS_DEPLOYMENT_TARGET="$IPHONEOS_DEPLOYMENT_TARGET" \
            CODE_SIGNING_ALLOWED=NO \
            | (command -v xcbeautify >/dev/null && xcbeautify || cat)

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: TestResults.xcresult
          retention-days: 14

  ui-tests:
    name: UI Tests
    runs-on: macos-15
    needs: build-and-test
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install xcbeautify
        run: brew install xcbeautify || true

      - name: Prepare iOS Simulator
        run: bash scripts/ci_prepare_ios_simulator.sh

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "Carelens-Aged+.xcodeproj" \
            -scheme "Carelens-Aged+" \
            -destination "$SIM_DESTINATION" \
            -configuration Debug \
            IPHONEOS_DEPLOYMENT_TARGET="$IPHONEOS_DEPLOYMENT_TARGET" \
            CODE_SIGNING_ALLOWED=NO \
            | (command -v xcbeautify >/dev/null && xcbeautify || cat)

      - name: Run UI tests (required)
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project "Carelens-Aged+.xcodeproj" \
            -scheme "Carelens-Aged+" \
            -destination "${SIM_TEST_DESTINATION:-$SIM_DESTINATION}" \
            -only-testing:"Carelens-Aged+UITests/Carelens_Aged_UITests" \
            -skip-testing:"Carelens-Aged+UITests/Carelens_Aged_ScreenshotTests" \
            -resultBundlePath UITestResults.xcresult \
            IPHONEOS_DEPLOYMENT_TARGET="$IPHONEOS_DEPLOYMENT_TARGET" \
            CODE_SIGNING_ALLOWED=NO \
            | (command -v xcbeautify >/dev/null && xcbeautify || cat)

      - name: Upload UI test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: UITestResults.xcresult
          retention-days: 14

  code-quality:
    name: Code Quality Gate
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift TODO/FIXME budget
        run: |
          TODOS=$(grep -rn "TODO" --include="*.swift" Carelens-Aged+ | wc -l | tr -d ' ')
          FIXMES=$(grep -rn "FIXME" --include="*.swift" Carelens-Aged+ | wc -l | tr -d ' ')
          echo "TODOs: $TODOS, FIXMEs: $FIXMES"
          if [ "$FIXMES" -gt 20 ]; then
            echo "Too many FIXME markers"
            exit 1
          fi

      - name: Verify Supabase schema present
        run: test -f supabase/migrations/001_primary_schema.sql

      - name: Verify Cloudflare worker example present
        run: test -f cloudflare/worker-backup.example.js

      - name: Verify deep-dark UI theme
        run: |
          test -f Carelens-Aged+/Theme/TabBarAppearance.swift
          test -f Carelens-Aged+/Theme/DesignSystem.swift
          grep -q "careLensDarkChrome" Carelens-Aged+/Theme/DesignSystem.swift
          grep -q "tabBarBackground" Carelens-Aged+/Theme/DesignSystem.swift

  deploy-testflight:
    name: Deploy to TestFlight
    runs-on: macos-15
    needs: [build-and-test, ui-tests, code-quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Apple certificate and provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Create App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$ASC_API_KEY_BASE64" | base64 --decode -o ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive for distribution
        run: |
          xcodebuild archive \
            -project "Carelens-Aged+.xcodeproj" \
            -scheme "Carelens-Aged+" \
            -archivePath $RUNNER_TEMP/CarelensAged.xcarchive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

      - name: Create export options
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>teamID</key>
              <string>TM2WG7HH96</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          EOF

      - name: Export and upload to TestFlight
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/CarelensAged.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/Export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

      - name: Upload success
        run: echo "Build uploaded to TestFlight successfully"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
